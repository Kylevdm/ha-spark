# mypy for the integration suite: the harness's Python (3.14), strict, no
# pydantic plugin (that one belongs to the add-on's config only), over the
# integration and its tests.
[mypy]
python_version = 3.14
strict = True
mypy_path = .
explicit_package_bases = True

# The harness ships no py.typed marker.
[mypy-pytest_homeassistant_custom_component.*]
ignore_missing_imports = True
