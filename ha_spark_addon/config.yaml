---
name: ha-spark
version: "0.28.0"
slug: ha_spark_addon
description: Local-first battery charge planner and automation agent for Home Assistant
url: https://github.com/Kylevdm/ha-spark
arch:
  - aarch64
  - amd64
init: true
# Stop grace before the Supervisor kills the add-on (default 10 s). A clean
# shutdown makes two verified Solis writes of up to ~15 s each (#164).
timeout: 45
homeassistant_api: true
# Default-role Supervisor API: the one-time first-start seed reads the add-on's
# stored options from /addons/self/info when options.json no longer holds them.
hassio_api: true
startup: services
boot: auto
discovery: [ha_spark]
# Shared HTTP listener: the UI uses HA's authenticated ingress proxy; the
# companion integration connects directly using its per-boot bearer channel.
# Not mapped to the host network. Must match api.server.INGRESS_PORT.
ingress: true
ingress_port: 8099
ports:
  8098/tcp: null
ports_description:
  8098/tcp: ha-spark agent surface (MCP + OpenAPI) — token-protected; leave unmapped unless used
options:
  log_level: INFO
schema:
  log_level: list(DEBUG|INFO|WARNING|ERROR)
