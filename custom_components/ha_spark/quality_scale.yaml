# Quality scale for the ha-spark companion integration (Bronze, Silver, Gold).
# Docs rules are todo until the onboarding and settings phases publish the
# integration documentation.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration provides no actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration provides no actions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities follow their coordinators and subscribe to no events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration provides no actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: Link failures surface as fixed outcome codes and entity availability rather than logs.
  parallel-updates:
    status: exempt
    comment: All entities are read-only projections of coordinator data.
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: The companion add-on is the only target; devices are fixed per site.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity carries meaningful values and is enabled by default.
  entity-translations: done
  exception-translations:
    status: exempt
    comment: The integration provides no actions, so it raises no user-facing exceptions.
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done
